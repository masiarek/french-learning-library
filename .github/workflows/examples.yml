# Every example must run and print exactly what its recorded .out file says — and
# every lesson page's generated output block must match that run.
#
# This is what makes the library trustworthy: a page cannot claim a program
# prints something it does not print, and code cannot rot quietly while the prose
# keeps describing the old behaviour.
#
# No dependency install step, deliberately: the examples are stdlib-only, so the
# job runs on the Python the runner already has. If this ever needs a `pip
# install`, an example has broken the rule.

name: examples

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: python3 --version
      - name: Run every example and check it against its answer key
        run: python3 tools/run_examples.py --check
      - name: Check every transcription in the source chapters' tables
        run: python3 tools/check_ipa.py
      - name: Check that each lesson's Anki deck matches its table
        run: |
          python3 tools/anki_from_tables.py 02_Yosser_teacher --check
          python3 tools/anki_from_tables.py 03_Szypowska --check
          python3 tools/anki_from_tables.py 04_Pronunciation --check
          python3 tools/anki_from_tables.py 05_1000_words --check
          python3 tools/anki_from_tables.py 06_Expressions --check
      - name: Check that each chapter's combined deck is up to date
        run: |
          python3 tools/combine_anki.py 02_Yosser_teacher --check
          python3 tools/combine_anki.py 03_Szypowska --check
          python3 tools/combine_anki.py 04_Pronunciation --check
          python3 tools/combine_anki.py 05_1000_words --check
          python3 tools/combine_anki.py 06_Expressions --check
