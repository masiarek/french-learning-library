# Build the MkDocs Material site (see mkdocs.yml at repo root) and deploy it to
# GitHub Pages on every push to master.
#
# The configure-pages step asks GitHub to turn Pages on with "GitHub Actions" as
# the source the first time it runs, so no manual setup is needed. If that call
# is refused, do it once by hand: Settings → Pages → Source: "GitHub Actions".
# The repo is on `master`, which the auto-created github-pages environment allows.

name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
